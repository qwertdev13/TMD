name: Update Journals

on:
  push:
    paths:
      - "journals/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: node scripts/process-journals.js

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html public/journals
          git commit -m "Auto-update journals" || echo "No changes"
          git push
